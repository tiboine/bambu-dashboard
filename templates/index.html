<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D-print status – Makerspace Ringebu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Jura:wght@400;600;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --orange: #d96c00;
      --dark:   #1a1b1f;
      --gray:   #f1f1f3;
      --mid:    #e0e0e3;
      --white:  #ffffff;
      --green:  #2ecc71;
      --red:    #e74c3c;
      --blue:   #3498db;
      --card-bg: #ffffff;
      --body-bg: #f1f1f3;
      --text:    #1a1b1f;
      --text-bold: #000000;
      --text-muted: #888;
      --text-faint: #bbb;
      --header-bg: #1a1b1f;
      --shadow: rgba(0,0,0,.08);
    }

    html.dark {
      --card-bg: #2a2b30;
      --body-bg: #18191d;
      --text:    #e8e8ec;
      --text-bold: #ffffff;
      --text-muted: #999;
      --text-faint: #555;
      --header-bg: #111215;
      --mid:     #3a3b40;
      --shadow:  rgba(0,0,0,.3);
      --gray:    #222328;
    }

    body {
      font-family: 'Jura', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--body-bg);
      color: var(--text);
      min-height: 100vh;
      transition: background .3s, color .3s;
    }

    /* ── Header ── */
    header {
      background: var(--header-bg);
      padding: 0 2rem;
      display: flex;
      align-items: center;
      height: 70px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(0,0,0,.4);
      gap: 1rem;
    }

    header img { height: 36px; filter: brightness(0) invert(1); flex-shrink: 0; }

    .header-center {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
    }

    .header-stat {
      display: flex;
      align-items: center;
      gap: 0.3rem;
      color: rgba(255,255,255,0.6);
      font-size: 0.78rem;
      font-weight: 600;
    }

    .header-stat-value {
      color: #fff;
      font-weight: 800;
      font-size: 1rem;
    }

    .header-stat-value.orange { color: var(--orange); }
    .header-stat-value.red { color: var(--red); }

    .header-stat-sep {
      width: 1px;
      height: 18px;
      background: rgba(255,255,255,0.15);
      margin: 0 0.2rem;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }

    .header-title {
      color: var(--white);
      font-size: 1rem;
      font-weight: 600;
      opacity: 0.7;
      letter-spacing: 0.03em;
    }

    .last-updated {
      font-size: 0.78rem;
      color: rgba(255,255,255,0.45);
      font-weight: 400;
    }

    .pulse-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: var(--green);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.5; transform: scale(0.85); }
    }

    /* ── Header buttons ── */
    .hdr-btn {
      background: rgba(255,255,255,0.1);
      border: none;
      color: rgba(255,255,255,0.6);
      width: 32px; height: 32px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background .2s, color .2s;
      font-size: 0.85rem;
    }
    .hdr-btn:hover { background: rgba(255,255,255,0.2); color: #fff; }
    .hdr-btn.active { background: var(--orange); color: #fff; }

    /* ── Fullscreen ── */
    :fullscreen header { display: none; }
    :fullscreen main { padding-top: 1rem; }

    /* ── Main ── */
    main {
      max-width: none;
      margin: 0 auto;
      padding: 1rem 0.75rem;
    }

    .section-title {
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--orange);
      margin-bottom: 1.2rem;
    }

    /* ── Grid ── */
    .grid {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      justify-content: center;
    }

    .grid > .card {
      width: calc((100% - 4 * 0.75rem) / 5);
      min-width: 160px;
      flex-shrink: 0;
    }

    /* ── Fit-to-screen mode ── */
    body.fit-screen {
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    body.fit-screen main {
      flex: 1;
      max-width: none;
      display: flex;
      flex-direction: column;
      padding: 0.3rem 0.4rem;
      overflow: hidden;
    }

    body.fit-screen .summary { display: none; }
    body.fit-screen .section-title { margin-bottom: 0.4rem; flex-shrink: 0; }
    body.fit-screen .grid {
      flex: 1;
      align-content: start;
      gap: 0.4rem;
      justify-content: center;
      zoom: 1.25;
    }
    body.fit-screen .card { min-height: 0; }
    body.fit-screen footer { display: none; }

    /* Kompakte kort i fit-screen */
    body.fit-screen .card-header { padding: 0.35rem 0.6rem 0.2rem; }
    body.fit-screen .card-name { font-size: 0.82rem; }
    body.fit-screen .badge { font-size: 0.55rem; padding: 2px 5px; }
    body.fit-screen .card-body { padding: 0 0.6rem 0.35rem; }
    body.fit-screen .thumb-wrap { padding: 0 0.4rem; margin-bottom: 0.2rem; }
    body.fit-screen .thumb-wrap img { max-height: 65px; }
    body.fit-screen .progress-pct { font-size: 1rem; margin-bottom: 0.1rem; }
    body.fit-screen .time-row { font-size: 0.65rem; padding: 0.1rem 0; margin-top: 0.1rem; }
    body.fit-screen .time-finish { font-size: 0.72rem; }
    body.fit-screen .idle-msg { font-size: 0.65rem; padding: 0.15rem 0; }

    /* Dynamiske kolonner */
    .grid.cols-5 {
      grid-template-columns: repeat(5, minmax(0, 1fr));
      justify-items: center;
    }

    /* Sentrere siste rad med flexbox-wrapper */
    .grid.cols-5 {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      justify-content: center;
    }

    .grid.cols-5 > .card {
      width: calc((100% - 4 * 0.4rem) / 5);
      min-width: 0;
    }

    /* ── Card ── */
    .card {
      background: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 1px 4px var(--shadow);
      transition: box-shadow .2s, background .3s;
      border-top: 8px solid var(--mid);
      position: relative;
    }

    .card.printing  { border-top-color: var(--orange); }
    .card.online    { border-top-color: var(--green); }
    .card.offline   { border-top-color: #999; opacity: .7; }
    .card.failed    { border-top-color: var(--red); animation: card-blink 1.5s ease-in-out infinite; }
    .card.paused    { border-top-color: #f39c12; animation: card-blink-warn 2s ease-in-out infinite; }
    .card.just-done { border-top-color: var(--green); }

    /* ── Background progress fill ── */
    .card-progress-bg {
      position: absolute;
      top: 0; left: 0;
      height: 100%;
      transition: width 2s ease;
      z-index: 0;
    }

    .card.printing .card-progress-bg {
      background-image: linear-gradient(
        -45deg,
        rgba(217,108,0,0.22) 25%, rgba(255,152,0,0.12) 25%,
        rgba(255,152,0,0.12) 50%, rgba(217,108,0,0.22) 50%,
        rgba(217,108,0,0.22) 75%, rgba(255,152,0,0.12) 75%
      );
      background-size: 40px 40px;
      animation: zebra-move 1.5s linear infinite;
    }

    .card.failed .card-progress-bg {
      background-image: linear-gradient(
        -45deg,
        rgba(231,76,60,0.2) 25%, rgba(231,76,60,0.1) 25%,
        rgba(231,76,60,0.1) 50%, rgba(231,76,60,0.2) 50%,
        rgba(231,76,60,0.2) 75%, rgba(231,76,60,0.1) 75%
      );
      background-size: 40px 40px;
    }

    .card.paused .card-progress-bg {
      background-image: linear-gradient(
        -45deg,
        rgba(243,156,18,0.2) 25%, rgba(243,156,18,0.1) 25%,
        rgba(243,156,18,0.1) 50%, rgba(243,156,18,0.2) 50%,
        rgba(243,156,18,0.2) 75%, rgba(243,156,18,0.1) 75%
      );
      background-size: 40px 40px;
    }

    .card.just-done .card-progress-bg {
      width: 100% !important;
      background: rgba(46,204,113,0.15);
      animation: done-pulse 2s ease-in-out infinite;
    }

    html.dark .card.printing .card-progress-bg {
      background-image: linear-gradient(
        -45deg,
        rgba(217,108,0,0.28) 25%, rgba(255,152,0,0.15) 25%,
        rgba(255,152,0,0.15) 50%, rgba(217,108,0,0.28) 50%,
        rgba(217,108,0,0.28) 75%, rgba(255,152,0,0.15) 75%
      );
      background-size: 40px 40px;
      animation: zebra-move 1.5s linear infinite;
    }

    html.dark .card.failed .card-progress-bg {
      background-image: linear-gradient(
        -45deg,
        rgba(231,76,60,0.25) 25%, rgba(231,76,60,0.12) 25%,
        rgba(231,76,60,0.12) 50%, rgba(231,76,60,0.25) 50%,
        rgba(231,76,60,0.25) 75%, rgba(231,76,60,0.12) 75%
      );
      background-size: 40px 40px;
    }

    html.dark .card.paused .card-progress-bg {
      background-image: linear-gradient(
        -45deg,
        rgba(243,156,18,0.25) 25%, rgba(243,156,18,0.12) 25%,
        rgba(243,156,18,0.12) 50%, rgba(243,156,18,0.25) 50%,
        rgba(243,156,18,0.25) 75%, rgba(243,156,18,0.12) 75%
      );
      background-size: 40px 40px;
    }

    html.dark .card.just-done .card-progress-bg {
      background: rgba(46,204,113,0.2);
    }

    @keyframes zebra-move {
      0%   { background-position: 0 0; }
      100% { background-position: 40px 40px; }
    }

    @keyframes done-pulse {
      0%, 100% { opacity: 0.6; }
      50%      { opacity: 1; }
    }

    @keyframes card-blink {
      0%, 100% { box-shadow: 0 1px 4px var(--shadow); }
      50%      { box-shadow: 0 0 20px rgba(231, 76, 60, 0.4); }
    }

    @keyframes card-blink-warn {
      0%, 100% { box-shadow: 0 1px 4px var(--shadow); }
      50%      { box-shadow: 0 0 16px rgba(243, 156, 18, 0.3); }
    }

    .card:hover { box-shadow: 0 4px 16px rgba(0,0,0,.12); }

    .card-header {
      padding: 1rem 1.25rem 0.75rem;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 0.5rem;
      position: relative;
      z-index: 1;
    }

    .card-name { font-size: 1rem; font-weight: 800; line-height: 1.2; flex: 1; }
    .card-model { font-size: 0.72rem; color: var(--text-muted); font-weight: 400; margin-top: 2px; }

    /* ── Status badge ── */
    .badge {
      font-size: 0.68rem; font-weight: 600; letter-spacing: 0.07em;
      text-transform: uppercase; padding: 3px 9px; border-radius: 20px; white-space: nowrap;
    }
    .badge-printing { background: #fff3e0; color: var(--orange); }
    .badge-online   { background: #e8f8f0; color: #27ae60; }
    .badge-offline  { background: #fdecea; color: var(--red); }
    .badge-idle     { background: #eef2ff; color: #5c6bc0; }
    .badge-done     { background: #e8f8f0; color: #27ae60; }

    html.dark .badge-printing { background: rgba(217,108,0,0.2); }
    html.dark .badge-online   { background: rgba(46,204,113,0.15); }
    html.dark .badge-offline  { background: rgba(231,76,60,0.2); }
    html.dark .badge-idle     { background: rgba(92,107,192,0.2); }
    html.dark .badge-done     { background: rgba(46,204,113,0.15); }

    /* ── Thumbnail ── */
    .thumb-wrap { padding: 0 1.25rem; margin-bottom: 0.75rem; position: relative; z-index: 1; }
    .thumb-wrap img {
      width: 100%; max-height: 160px; object-fit: contain; border-radius: 8px;
      mix-blend-mode: multiply;
    }
    html.dark .thumb-wrap img {
      mix-blend-mode: screen;
      filter: brightness(0.9);
    }

    /* ── Job info ── */
    .card-body { padding: 0 1.25rem 1.25rem; position: relative; z-index: 1; }
    .job-name {
      font-size: 0.85rem; font-weight: 600; margin-bottom: 0.6rem;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text);
    }
    .job-name span { color: var(--text-muted); font-weight: 400; }

    /* ── Progress percentage ── */
    .progress-pct {
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--orange);
      margin-bottom: 0.3rem;
    }

    /* ── Info row (temp, layer, speed) ── */
    .info-row { display: flex; gap: 1rem; font-size: 0.72rem; color: var(--text-muted); margin-top: 0.5rem; flex-wrap: wrap; }
    .info-item { display: flex; align-items: center; gap: 3px; }
    .info-item svg { flex-shrink: 0; }

    /* ── Time remaining ── */
    .time-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--text-bold);
      margin-top: 0.4rem;
      padding: 0.3rem 0;
    }
    .time-row svg { flex-shrink: 0; color: var(--orange); }
    .time-finish { font-weight: 800; font-size: 1rem; }

    /* ── Idle / offline message ── */
    .idle-msg { font-size: 0.82rem; color: var(--text-faint); font-style: italic; padding: 0.5rem 0; }

    /* ── Error banner ── */
    .error-banner {
      background: #fdecea; border: 1px solid #f5c6cb; border-radius: 8px;
      padding: 0.9rem 1.25rem; color: #c0392b; font-size: 0.85rem; margin-bottom: 1.5rem; display: none;
    }
    html.dark .error-banner { background: rgba(231,76,60,0.15); border-color: rgba(231,76,60,0.3); }

    /* ── Verify code form ── */
    .verify-form {
      background: var(--card-bg); border-radius: 12px; padding: 2rem;
      max-width: 420px; margin: 0 auto 2rem; box-shadow: 0 2px 12px var(--shadow);
      text-align: center; display: none;
    }
    .verify-form h2 { font-size: 1.1rem; font-weight: 800; margin-bottom: 0.5rem; color: var(--text); }
    .verify-form p { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 1.2rem; }
    .verify-input {
      font-family: 'Jura', monospace; font-size: 1.5rem; font-weight: 800; letter-spacing: 0.5em;
      text-align: center; border: 2px solid var(--mid); border-radius: 8px; padding: 0.6rem 1rem;
      width: 200px; outline: none; transition: border-color .2s; background: var(--card-bg); color: var(--text);
    }
    .verify-input:focus { border-color: var(--orange); }
    .verify-btn {
      display: inline-block; margin-top: 1rem; padding: 0.6rem 2rem; background: var(--orange);
      color: var(--white); border: none; border-radius: 8px; font-family: 'Jura', sans-serif;
      font-size: 0.9rem; font-weight: 700; cursor: pointer; transition: background .2s;
    }
    .verify-btn:hover { background: #b85c00; }
    .verify-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .verify-error { color: var(--red); font-size: 0.8rem; margin-top: 0.75rem; display: none; }

    /* ── Summary bar (hidden, moved to header) ── */
    .summary { display: none; }

    /* ── Empty state ── */
    .empty { text-align: center; padding: 4rem 1rem; color: var(--text-faint); font-size: 0.95rem; }

    /* ── Today bar ── */
    .today-bar {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 3rem;
      padding: 1rem 2rem;
      margin: 0;
      background: var(--card-bg);
      border-top: 1px solid var(--mid);
      transition: background .3s;
    }

    body.fit-screen .today-bar {
      padding: 0.3rem 1rem;
      flex-shrink: 0;
    }

    .today-item {
      display: flex;
      align-items: baseline;
      gap: 0.4rem;
    }

    .today-label {
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-muted);
    }

    .today-value {
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--orange);
    }

    body.fit-screen .today-value { font-size: 1.1rem; }
    body.fit-screen .today-label { font-size: 0.55rem; }

    /* ── Footer ── */
    footer { text-align: center; padding: 2rem; font-size: 0.72rem; color: var(--text-faint); }
    footer a { color: var(--orange); text-decoration: none; }
  </style>
</head>
<body>

<header>
  <img src="https://www.makerspaceringebu.no/wp-content/uploads/2021/05/MSR_navnetrekk-liggende-svart.png"
       alt="Makerspace Ringebu" />
  <div class="header-center" id="header-stats"></div>
  <div class="header-right">
    <a href="/" style="color:#fff;text-decoration:none;font-size:0.85rem;font-weight:600;padding:0.4rem 0.8rem;border-radius:6px;background:var(--orange);">Dashboard</a>
    <a href="/stats" style="color:rgba(255,255,255,0.5);text-decoration:none;font-size:0.85rem;font-weight:600;padding:0.4rem 0.8rem;border-radius:6px;" onmouseover="this.style.color='#fff'" onmouseout="this.style.color='rgba(255,255,255,0.5)'">Statistikk</a>
    <span class="last-updated" id="last-updated">Henter data...</span>
    <div class="pulse-dot" id="pulse" style="background: #888;"></div>

    <!-- Auto fit-to-screen toggle -->
    <button class="hdr-btn" onclick="toggleAuto()" id="auto-btn" title="Tilpass til skjerm" style="font-size:0.65rem;width:auto;padding:0 8px;">Auto</button>

    <!-- Morkt tema -->
    <button class="hdr-btn" id="theme-btn" onclick="toggleTheme()" title="Bytt tema">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 12.79A9 9 0 1111.21 3a7 7 0 009.79 9.79z"/>
      </svg>
    </button>

    <!-- Fullskjerm -->
    <button class="hdr-btn" onclick="toggleFullscreen()" title="Fullskjerm">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M8 3H5a2 2 0 00-2 2v3m18 0V5a2 2 0 00-2-2h-3m0 18h3a2 2 0 002-2v-3M3 16v3a2 2 0 002 2h3"/>
      </svg>
    </button>
  </div>
</header>

<main>
  <div class="verify-form" id="verify-form">
    <h2>Verifiseringskode</h2>
    <p>En kode er sendt til din e-post. Skriv inn koden for a koble til Bambu Lab.</p>
    <input type="text" class="verify-input" id="verify-code" maxlength="6" placeholder="______" autocomplete="one-time-code" inputmode="numeric" />
    <br />
    <button class="verify-btn" id="verify-btn" onclick="submitCode()">Bekreft</button>
    <br />
    <button class="verify-btn" id="resend-btn" onclick="resendCode()" style="background: transparent; color: var(--orange); border: 1px solid var(--orange); margin-top: 0.5rem; font-size: 0.8rem; padding: 0.4rem 1.2rem;">Send kode pa nytt</button>
    <div class="verify-error" id="verify-error"></div>
  </div>

  <div class="error-banner" id="error-banner"></div>
  <div class="summary" id="summary"></div>
  <div class="grid" id="grid">
    <div class="empty">Laster printere...</div>
  </div>
</main>

<div class="today-bar" id="today-bar"></div>

<footer>
  <a href="https://makerspaceringebu.no" target="_blank">makerspaceringebu.no</a>
  &nbsp;&middot;&nbsp; Sanntidsoppdatering via MQTT
</footer>

<script>
  // ── State ──
  const alertedPrinters = new Set();
  const finishedAt = {}; // printer id -> timestamp when it finished
  let autoMode = false;

  // ── Lydvarsel ──
  function playAlertSound() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      [0, 0.3, 0.6].forEach(delay => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        osc.frequency.value = 880; osc.type = 'square'; gain.gain.value = 0.08;
        osc.start(ctx.currentTime + delay); osc.stop(ctx.currentTime + delay + 0.15);
      });
    } catch (e) {}
  }

  // ── Tema ──
  function toggleTheme() {
    document.documentElement.classList.toggle('dark');
    localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
  }
  if (localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark');

  // ── Fullskjerm ──
  function toggleFullscreen() {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen();
  }

  // Auto-fullskjerm hvis ?autoscreen i URL (fra start.bat)
  if (new URLSearchParams(location.search).has('autoscreen')) {
    const tryFullscreen = () => {
      document.documentElement.requestFullscreen().catch(() => {});
      document.removeEventListener('click', tryFullscreen);
      document.removeEventListener('keydown', tryFullscreen);
    };
    // Prøv umiddelbart (virker i noen oppsett), ellers ved første interaksjon
    setTimeout(() => {
      document.documentElement.requestFullscreen().catch(() => {
        document.addEventListener('click', tryFullscreen, { once: true });
        document.addEventListener('keydown', tryFullscreen, { once: true });
      });
    }, 1000);
  }

  // ── Auto toggle ──
  function toggleAuto() {
    autoMode = !autoMode;
    const btn = document.getElementById('auto-btn');
    if (autoMode) {
      document.body.classList.add('fit-screen');
      btn.classList.add('active');
      applyAutoGrid();
    } else {
      document.body.classList.remove('fit-screen');
      const grid = document.getElementById('grid');
      grid.classList.remove('cols-5');
      btn.classList.remove('active');
    }
    localStorage.setItem('autoMode', autoMode ? '1' : '0');
  }

  function applyAutoGrid() {
    if (!autoMode) return;
    const grid = document.getElementById('grid');
    grid.classList.remove('cols-5');
    grid.classList.add('cols-5');
  }

  // Gjenopprett auto-modus
  if (localStorage.getItem('autoMode') === '1') {
    autoMode = true;
    document.body.classList.add('fit-screen');
    document.getElementById('auto-btn').classList.add('active');
  }

  // ── Hjelpefunksjoner ──
  function formatTime(seconds) {
    if (!seconds || seconds <= 0) return null;
    const h = Math.floor(seconds / 3600);
    const m = Math.floor((seconds % 3600) / 60);
    if (h > 0) return `${h}t ${m}m`;
    if (m > 0) return `${m} min`;
    return 'Under 1 min';
  }

  function estimatedFinish(seconds) {
    if (!seconds || seconds <= 0) return null;
    const finish = new Date(Date.now() + seconds * 1000);
    const hh = String(finish.getHours()).padStart(2, '0');
    const mm = String(finish.getMinutes()).padStart(2, '0');
    return `${hh}:${mm}`;
  }

  function speedLabel(lvl) {
    const labels = { 1: 'Stille', 2: 'Normal', 3: 'Sport', 4: 'Ludicrous' };
    return labels[lvl] || null;
  }

  function getEffectiveStatus(printer) {
    const s = (printer.print_status || '').toUpperCase();
    if (s === 'SUCCESS' || s === 'FINISH') {
      // Sjekk om den nettopp ble ferdig (under 2 min siden)
      if (!finishedAt[printer.id]) {
        finishedAt[printer.id] = Date.now();
      }
      const elapsed = Date.now() - finishedAt[printer.id];
      if (elapsed < 120000) return 'JUST_DONE';
      return 'IDLE'; // etter 2 min -> ledig
    }
    // Hvis printeren ikke lenger er ferdig, nullstill
    if (finishedAt[printer.id] && s !== 'SUCCESS' && s !== 'FINISH') {
      delete finishedAt[printer.id];
    }
    return s;
  }

  function statusLabel(printer) {
    if (!printer.online) return { text: 'Offline', cls: 'badge-offline' };
    const s = getEffectiveStatus(printer);
    if (s === 'RUNNING' || s === 'PRINTING') return { text: 'Printer', cls: 'badge-printing' };
    if (s === 'FAIL' || s === 'FAILED') return { text: 'Feil', cls: 'badge-offline' };
    if (s === 'PAUSED' || s === 'PAUSE') return { text: 'Pauset', cls: 'badge-printing' };
    if (s === 'JUST_DONE') return { text: 'Ferdig', cls: 'badge-done' };
    if (s === 'IDLE' || s === '' || s === 'SUCCESS' || s === 'FINISH') return { text: 'Ledig', cls: 'badge-idle' };
    return { text: printer.print_status || 'Online', cls: 'badge-online' };
  }

  function cardClass(printer) {
    if (!printer.online) return 'offline';
    const s = getEffectiveStatus(printer);
    if (s === 'RUNNING' || s === 'PRINTING') return 'printing';
    if (s === 'FAIL' || s === 'FAILED') return 'failed';
    if (s === 'PAUSED' || s === 'PAUSE') return 'paused';
    if (s === 'JUST_DONE') return 'just-done';
    return 'online';
  }

  function sortPrinters(printers) {
    const order = { printing: 0, failed: 1, paused: 2, 'just-done': 3, online: 4, offline: 5 };
    return printers.sort((a, b) => (order[cardClass(a)] ?? 4) - (order[cardClass(b)] ?? 4));
  }

  function renderCard(p) {
    const badge = statusLabel(p);
    const cls = cardClass(p);
    const isPrinting = cls === 'printing';
    const isFailed = cls === 'failed';
    const isPaused = cls === 'paused';
    const isJustDone = cls === 'just-done';
    const hasJob = isPrinting || isFailed || isPaused;
    const progress = p.progress != null ? parseFloat(p.progress) : null;
    const timeStr = formatTime(p.time_remaining);
    const finishStr = estimatedFinish(p.time_remaining);

    // Bakgrunns-progress med zebra (hastighet basert på spd_lvl)
    const zebraSpeeds = { 1: '3s', 2: '1.5s', 3: '1.2s', 4: '0.9s' };
    const zebraSpeed = zebraSpeeds[p.spd_lvl] || '1.5s';
    let progressBg = '';
    if (hasJob && progress != null) {
      progressBg = `<div class="card-progress-bg" style="width: ${progress}%; animation-duration: ${zebraSpeed}"></div>`;
    } else if (isJustDone) {
      progressBg = `<div class="card-progress-bg"></div>`;
    }

    let thumbHtml = '';
    if (p.thumbnail) {
      thumbHtml = `<div class="thumb-wrap"><img src="${p.thumbnail}" alt="Forhandsvisning" /></div>`;
    }

    let bodyHtml = '';

    if (isFailed) {
      bodyHtml += `<div class="idle-msg" style="color: var(--red); font-style: normal; font-weight: 600;">Printing feilet!</div>`;
    } else if (isPaused) {
      bodyHtml += `<div class="idle-msg" style="color: #f39c12; font-style: normal; font-weight: 600;">Printing pauset</div>`;
    }

    if ((isPrinting || isPaused) && progress != null) {
      bodyHtml += `<div class="progress-pct">${Math.round(progress)}%</div>`;
      if (timeStr || finishStr) {
        bodyHtml += `
          <div class="time-row">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
            </svg>
            ${timeStr ? timeStr + ' gjenstår' : ''}${timeStr && finishStr ? ' — ' : ''}${finishStr ? '<span class="time-finish">Ferdig ' + finishStr + '</span>' : ''}
          </div>`;
      }
    } else if (isFailed && progress != null) {
      bodyHtml += `<div class="progress-pct" style="color: var(--red)">Stoppet ${Math.round(progress)}%</div>`;
    } else if (isJustDone) {
      bodyHtml += `<div class="idle-msg" style="color: var(--green); font-style: normal; font-weight: 700;">Print fullfort!</div>`;
    } else if (!p.online) {
      bodyHtml += `<div class="idle-msg">Printeren er ikke tilgjengelig.</div>`;
    } else if (!hasJob) {
      bodyHtml += `<div class="idle-msg">Ingen aktiv jobb.</div>`;
    }

    const infoHtml = '';

    return `
      <div class="card ${cls}">
        ${progressBg}
        <div class="card-header">
          <div>
            <div class="card-name">${p.name}</div>
          </div>
          <span class="badge ${badge.cls}">${badge.text}</span>
        </div>
        ${thumbHtml}
        <div class="card-body">${bodyHtml}${infoHtml}</div>
      </div>`;
  }

  function renderSummary(printers) {
    const total = printers.length;
    const online = printers.filter(p => p.online).length;
    const printing = printers.filter(p => { const s = getEffectiveStatus(p); return s === 'RUNNING' || s === 'PRINTING'; }).length;
    const failed = printers.filter(p => { const s = getEffectiveStatus(p); return s === 'FAIL' || s === 'FAILED'; }).length;

    // Render into header
    let headerHtml = `
      <span class="header-stat"><span class="header-stat-value">${total}</span> totalt</span>
      <span class="header-stat-sep"></span>
      <span class="header-stat"><span class="header-stat-value">${online}</span> online</span>
      <span class="header-stat-sep"></span>
      <span class="header-stat"><span class="header-stat-value orange">${printing}</span> printer</span>`;
    if (failed > 0) headerHtml += `<span class="header-stat-sep"></span><span class="header-stat"><span class="header-stat-value red">${failed}</span> feil</span>`;
    document.getElementById('header-stats').innerHTML = headerHtml;

    return ''; // summary div is hidden now
  }

  // ── Verifisering ──
  async function submitCode() {
    const input = document.getElementById('verify-code');
    const btn = document.getElementById('verify-btn');
    const errEl = document.getElementById('verify-error');
    const code = input.value.trim();
    if (!code) return;
    btn.disabled = true; btn.textContent = 'Verifiserer...'; errEl.style.display = 'none';
    try {
      const res = await fetch('/api/verify', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ code }) });
      const data = await res.json();
      if (data.ok) { document.getElementById('verify-form').style.display = 'none'; refresh(); }
      else { errEl.textContent = data.error || 'Ugyldig kode.'; errEl.style.display = 'block'; }
    } catch (e) { errEl.textContent = 'Nettverksfeil.'; errEl.style.display = 'block'; }
    finally { btn.disabled = false; btn.textContent = 'Bekreft'; }
  }

  async function resendCode() {
    const btn = document.getElementById('resend-btn');
    const errEl = document.getElementById('verify-error');
    btn.disabled = true; btn.textContent = 'Sender...'; errEl.style.display = 'none';
    try {
      const res = await fetch('/api/send-code', { method: 'POST' });
      const data = await res.json();
      if (data.ok) { btn.textContent = 'Kode sendt!'; setTimeout(() => { btn.textContent = 'Send kode pa nytt'; btn.disabled = false; }, 3000); }
      else { errEl.textContent = data.error || 'Kunne ikke sende kode.'; errEl.style.display = 'block'; btn.textContent = 'Send kode pa nytt'; btn.disabled = false; }
    } catch (e) { errEl.textContent = 'Nettverksfeil.'; errEl.style.display = 'block'; btn.textContent = 'Send kode pa nytt'; btn.disabled = false; }
  }

  document.getElementById('verify-code').addEventListener('keydown', e => { if (e.key === 'Enter') submitCode(); });

  // ── Hovedoppdatering ──
  async function refresh() {
    try {
      const res = await fetch('/api/status');
      const data = await res.json();
      const verifyForm = document.getElementById('verify-form');
      const errorEl = document.getElementById('error-banner');

      if (data.needs_verify_code) {
        verifyForm.style.display = 'block'; errorEl.style.display = 'none';
        document.getElementById('grid').innerHTML = ''; document.getElementById('summary').innerHTML = '';
        return;
      } else { verifyForm.style.display = 'none'; }

      if (data.error) { errorEl.textContent = 'Feil: ' + data.error; errorEl.style.display = 'block'; }
      else { errorEl.style.display = 'none'; }

      if (data.last_updated) document.getElementById('last-updated').textContent = 'Sist oppdatert: ' + data.last_updated;

      document.getElementById('pulse').style.background = data.mqtt_connected ? '#2ecc71' : (data.error ? '#e74c3c' : '#888');

      const grid = document.getElementById('grid');
      const summary = document.getElementById('summary');

      if (!data.printers || data.printers.length === 0) {
        grid.innerHTML = '<div class="empty">Ingen printere funnet.</div>'; summary.innerHTML = ''; return;
      }

      // Lydvarsel
      data.printers.forEach(p => {
        const s = (p.print_status || '').toUpperCase();
        if (s === 'FAIL' || s === 'FAILED') { if (!alertedPrinters.has(p.id)) { alertedPrinters.add(p.id); playAlertSound(); } }
        else { alertedPrinters.delete(p.id); }
      });

      const sorted = sortPrinters(data.printers);
      lastPrinters = sorted;
      summary.innerHTML = renderSummary(sorted);
      grid.innerHTML = sorted.map(renderCard).join('');

      if (autoMode) applyAutoGrid();
    } catch (e) { console.error('Kunne ikke hente status:', e); }
  }

  let lastPrinters = [];

  function todayDateStr() {
    return new Date().toISOString().slice(0, 10); // "YYYY-MM-DD"
  }

  function calcOngoingFilament(printers) {
    // Kun pågående print som startet i dag
    const today = todayDateStr();
    let weightG = 0;
    if (!printers) return weightG;
    printers.forEach(p => {
      const s = getEffectiveStatus(p);
      if ((s === 'RUNNING' || s === 'PRINTING') && p.progress != null && p.job_started_at) {
        if (p.job_started_at.slice(0, 10) === today) {
          const pct = parseFloat(p.progress) / 100;
          weightG += pct * 20; // estimat ~20g per print
        }
      }
    });
    return Math.round(weightG);
  }

  async function refreshToday() {
    try {
      const res = await fetch('/api/today');
      const d = await res.json();
      const bar = document.getElementById('today-bar');

      // Legg til estimert forbruk fra pågående print som startet i dag
      const ongoingG = calcOngoingFilament(lastPrinters);
      const totalWeightG = Math.round(d.weight_g) + ongoingG;
      const meters = Math.round((totalWeightG / 1000) * 330);
      const lengthStr = meters >= 1000 ? `${(meters / 1000).toFixed(1)}km` : `${meters}m`;

      bar.innerHTML = `
        <div class="today-item"><span class="today-label">I dag</span></div>
        <div class="today-item"><span class="today-value">${d.prints}</span><span class="today-label">prints</span></div>
        <div class="today-item"><span class="today-value">${totalWeightG}g</span><span class="today-label">filament</span></div>
        <div class="today-item"><span class="today-value">${lengthStr}</span><span class="today-label">lengde</span></div>
      `;
    } catch (e) {}
  }

  refresh();
  refreshToday();
  setInterval(refresh, 5000);
  setInterval(refreshToday, 60000);
</script>
</body>
