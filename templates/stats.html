<!DOCTYPE html>
<html lang="no" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Printerstatistikk – Makerspace Ringebu</title>
  <script>
    try { if (localStorage.getItem('theme') === 'light') document.documentElement.dataset.theme = 'light'; } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='hud.css') }}?v=4" />
  <style>
    main { max-width: 1320px; margin: 0 auto; padding: 1.5rem 1.25rem 3rem; }

    .page-title { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; flex-wrap: wrap; margin-bottom: 1.1rem; }
    .page-title h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; }
    .page-title h1 span { color: var(--orange); }
    .sync-info { font-family: var(--font-mono); font-size: 0.72rem; color: var(--text-dim); }

    /* KPI-fliser */
    .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: var(--gap); margin-bottom: 1.5rem; }
    .kpi { padding: 1rem 1.1rem; display: flex; flex-direction: column; gap: 0.35rem; overflow: hidden; }
    .kpi b {
      font-family: var(--font-mono);
      font-size: 1.85rem;
      font-weight: 700;
      line-height: 1.05;
      color: var(--k, var(--text));
      text-shadow: 0 0 18px color-mix(in srgb, var(--k, transparent) 18%, transparent);
    }
    .kpi::after {
      content: '';
      position: absolute;
      left: 0; right: 0; bottom: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--k, var(--line-strong)), transparent);
      opacity: 0.8;
    }

    /* Sortering */
    .toolbar { display: flex; align-items: center; gap: 0.4rem; flex-wrap: wrap; margin-bottom: var(--gap); }
    .toolbar .eyebrow { margin-right: 0.4rem; }
    .sort-btn {
      padding: 0.4rem 0.8rem;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--text-dim);
      font: 600 0.72rem/1 var(--font-display);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      cursor: pointer;
    }
    .sort-btn:hover { color: var(--text); border-color: var(--line-strong); }
    .sort-btn.active { color: var(--orange); border-color: rgba(255, 122, 26, 0.6); background: rgba(255, 122, 26, 0.1); }

    /* Printerkort */
    .pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: var(--gap); }
    .pcard { --accent: var(--orange); padding: 1.1rem 1.2rem 1.2rem; }
    .pcard-head { display: flex; align-items: center; gap: 1rem; margin-bottom: 1rem; }
    .pcard-title { flex: 1; min-width: 0; }
    .pcard-name { font-size: 1.15rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pcard-model { font-family: var(--font-mono); font-size: 0.66rem; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.08em; }

    /* Suksessrate-ring */
    .ring { position: relative; width: 64px; height: 64px; flex-shrink: 0; }
    .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
    .ring circle { fill: none; stroke-width: 6; }
    .ring .track { stroke: rgba(255, 61, 94, 0.35); }
    .ring .val { stroke: var(--green); stroke-linecap: round; filter: drop-shadow(0 0 2px var(--green)); }
    .ring span {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      font-family: var(--font-mono); font-size: 0.85rem; font-weight: 700;
    }

    .pstats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.5rem; padding: 0.8rem 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
    .pstat { display: flex; flex-direction: column; gap: 0.2rem; min-width: 0; }
    .pstat b { font-family: var(--font-mono); font-size: 1.05rem; font-weight: 700; white-space: nowrap; }
    .pstat .eyebrow { font-size: 0.58rem; }
    .pstat.hl b { color: var(--orange); }

    .okfail { display: flex; justify-content: space-between; margin-top: 0.6rem; font-family: var(--font-mono); font-size: 0.7rem; color: var(--text-dim); }
    .okfail .ok { color: var(--green); }
    .okfail .fail { color: var(--red); }

    .section-label { margin: 1rem 0 0.45rem; }
    .ams { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .ams-item { display: flex; flex-direction: column; align-items: center; gap: 3px; font-family: var(--font-mono); font-size: 0.58rem; color: var(--text-dim); }
    .ams-item i { width: 20px; height: 20px; border-radius: 5px; border: 1px solid rgba(255, 255, 255, 0.25); box-shadow: 0 0 10px rgba(0, 0, 0, 0.4); }
    html[data-theme="light"] .ams-item i { border-color: rgba(0, 0, 0, 0.18); box-shadow: none; }

    .recent { list-style: none; display: flex; flex-direction: column; gap: 0.15rem; }
    .recent li { display: flex; align-items: center; gap: 0.55rem; font-size: 0.78rem; padding: 0.2rem 0; }
    .recent .dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; background: var(--red); box-shadow: 0 0 6px var(--red); }
    .recent .dot.ok { background: var(--green); box-shadow: 0 0 6px var(--green); }
    .recent .title { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .recent .when { font-family: var(--font-mono); font-size: 0.66rem; color: var(--text-faint); white-space: nowrap; }
  </style>
</head>
<body>

<header class="hud-header">
  <div class="hud-brand">
    <img src="https://www.makerspaceringebu.no/wp-content/uploads/2021/05/MSR_navnetrekk-liggende-svart.png" alt="Makerspace Ringebu" />
    <span class="hud-brand-tag">Statistikk</span>
  </div>
  <div class="hud-stats"></div>
  <div class="hud-right">
    <nav class="hud-nav">
      <a href="/">Dashboard</a>
      <a href="/stats" class="active">Statistikk</a>
    </nav>
    <button class="hud-btn" id="theme-btn" type="button" title="Bytt tema" aria-label="Bytt tema">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1111.21 3a7 7 0 009.79 9.79z"/></svg>
    </button>
  </div>
</header>

<main>
  <div class="hud-empty" id="loading">Henter statistikk…</div>
  <div id="content" hidden>
    <div class="page-title">
      <h1>Print<span>//</span>logg</h1>
      <span class="sync-info" id="sync-info"></span>
    </div>
    <div class="hud-banner is-warn" id="incomplete" hidden>Historikken lastes fortsatt inn – tallene er ikke komplette ennå.</div>
    <div class="kpis" id="kpis"></div>
    <div class="toolbar" id="toolbar"><span class="eyebrow">Sorter</span></div>
    <div class="pgrid" id="pgrid"></div>
  </div>
</main>

<script>
(function () {
  'use strict';
  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  $('#theme-btn').addEventListener('click', () => {
    const light = document.documentElement.dataset.theme !== 'light';
    document.documentElement.dataset.theme = light ? 'light' : 'dark';
    try { localStorage.setItem('theme', light ? 'light' : 'dark'); } catch (e) {}
  });

  function formatDuration(s) {
    s = s || 0;
    const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
    if (h >= 24) return `${Math.floor(h / 24)}d ${h % 24}t`;
    return h > 0 ? `${h}t ${m}m` : `${m}m`;
  }
  const formatWeight = g => (g = g || 0) >= 1000 ? (g / 1000).toFixed(1) + ' kg' : Math.round(g) + ' g';
  const formatLength = cm => { const m = (cm || 0) / 100; return m >= 1000 ? (m / 1000).toFixed(1) + ' km' : Math.round(m) + ' m'; };
  const formatDate = iso => iso ? new Date(iso).toLocaleDateString('nb-NO', { day: 'numeric', month: 'short' }) : '';
  const rate = d => d.total_prints > 0 ? Math.round(d.successful / d.total_prints * 100) : 0;

  const SORTS = [
    ['total_prints', 'Prints', d => d.total_prints],
    ['rate', 'Suksess', rate],
    ['total_time_s', 'Tid', d => d.total_time_s],
    ['total_weight_g', 'Filament', d => d.total_weight_g],
    ['name', 'Navn', d => d.name],
  ];
  let sortKey = 'name';
  let devices = [], amsColors = {};

  function kpi(label, value, color) {
    return `<div class="kpi panel" style="${color ? `--k:var(--${color})` : ''}">
      <span class="eyebrow">${esc(label)}</span><b>${esc(value)}</b></div>`;
  }

  function ring(pct) {
    const r = 26, c = 2 * Math.PI * r;
    return `<div class="ring" title="Suksessrate">
      <svg viewBox="0 0 64 64"><circle class="track" cx="32" cy="32" r="${r}"/>
      <circle class="val" cx="32" cy="32" r="${r}" stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - pct / 100)}"/></svg>
      <span>${pct}%</span></div>`;
  }

  function card(d) {
    const colors = (amsColors[d.device_id] || []).filter(c => /^#[0-9a-f]{6}$/i.test(c.color || ''));
    const tasks = (d.tasks || []).slice(0, 5);
    return `<article class="pcard panel hud-corners">
      <div class="pcard-head">
        <div class="pcard-title"><div class="pcard-name">${esc(d.name)}</div><div class="pcard-model">${esc(d.model)}</div></div>
        ${ring(rate(d))}
      </div>
      <div class="pstats">
        <div class="pstat hl"><b>${d.total_prints}</b><span class="eyebrow">Prints</span></div>
        <div class="pstat"><b>${formatDuration(d.total_time_s)}</b><span class="eyebrow">Tid</span></div>
        <div class="pstat"><b>${formatWeight(d.total_weight_g)}</b><span class="eyebrow">Filament</span></div>
        <div class="pstat"><b>${formatLength(d.total_length_cm)}</b><span class="eyebrow">Lengde</span></div>
      </div>
      <div class="okfail"><span class="ok">▲ ${d.successful} vellykket</span><span class="fail">${d.failed} feilet ▼</span></div>
      ${colors.length ? `<div class="eyebrow section-label">Filament lastet</div>
        <div class="ams">${colors.map(c => `<span class="ams-item"><i style="background:${c.color}" title="${esc(c.type)} ${c.color}"></i>${esc(c.type)}</span>`).join('')}</div>` : ''}
      ${tasks.length ? `<div class="eyebrow section-label">Siste prints</div>
        <ul class="recent">${tasks.map(t => `<li><span class="dot ${t.status === 2 ? 'ok' : ''}"></span>
          <span class="title">${esc(t.title || '–')}</span>
          <span class="when">${esc(formatDate(t.start_time))} · ${formatDuration(t.cost_time)}</span></li>`).join('')}</ul>` : ''}
    </article>`;
  }

  function renderGrid() {
    const [, , get] = SORTS.find(s => s[0] === sortKey);
    // Fjernede printere telles i totalene, men får ikke eget kort
    const sorted = devices.filter(d => !d.removed).sort((a, b) => sortKey === 'name'
      ? a.name.localeCompare(b.name, 'no', { numeric: true, sensitivity: 'base' })
      : get(b) - get(a));
    $('#pgrid').innerHTML = sorted.map(card).join('');
    document.querySelectorAll('.sort-btn').forEach(b => b.classList.toggle('active', b.dataset.key === sortKey));
  }

  async function load() {
    try {
      const [res, colorsRes] = await Promise.all([fetch('/api/stats'), fetch('/api/ams-colors')]);
      const data = await res.json();
      amsColors = await colorsRes.json().catch(() => ({}));
      if (data.error) { $('#loading').textContent = 'Feil: ' + data.error; return; }

      devices = data.devices || [];
      const t = devices.reduce((a, d) => ({
        prints: a.prints + d.total_prints, ok: a.ok + d.successful, fail: a.fail + d.failed,
        time: a.time + d.total_time_s, weight: a.weight + d.total_weight_g, length: a.length + (d.total_length_cm || 0),
      }), { prints: 0, ok: 0, fail: 0, time: 0, weight: 0, length: 0 });

      $('#kpis').innerHTML =
        kpi('Totalt prints', t.prints, 'orange') +
        kpi('Vellykket', t.ok, 'green') +
        kpi('Feilet / avbrutt', t.fail, 'red') +
        kpi('Suksessrate', (t.prints ? Math.round(t.ok / t.prints * 100) : 0) + '%', 'cyan') +
        kpi('Total printtid', formatDuration(t.time)) +
        kpi('Filament', formatWeight(t.weight)) +
        kpi('Lengde', formatLength(t.length));

      $('#incomplete').hidden = data.data_complete !== false;
      $('#sync-info').textContent = data.last_sync ? 'Sist synkronisert ' + new Date(data.last_sync).toLocaleString('nb-NO', { dateStyle: 'short', timeStyle: 'short' }) : '';

      const bar = $('#toolbar');
      SORTS.forEach(([key, label]) => {
        const b = document.createElement('button');
        b.className = 'sort-btn'; b.type = 'button'; b.dataset.key = key; b.textContent = label;
        b.addEventListener('click', () => { sortKey = key; renderGrid(); });
        bar.append(b);
      });
      renderGrid();

      $('#loading').hidden = true;
      $('#content').hidden = false;
    } catch (e) {
      $('#loading').textContent = 'Kunne ikke hente statistikk.';
      console.error(e);
    }
  }
  load();
})();
</script>
</body>
</html>
